<!doctype html>
<html lang="id" data-mode="terang">

<head>
  <script src="tema.js"></script>
  <script>
    /* Set mode sebelum render (tanpa kedip). Pilihan di Pengaturan > Tampilan menimpa TEMA.mode. */
    (function () {
      var m = (window.TEMA && TEMA.mode) || 'auto';
      try { var t = JSON.parse(localStorage.getItem('website-rt-tampilan') || 'null'); if (t && t.mode) m = t.mode; } catch (e) { }
      if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'gelap' : 'terang';
      document.documentElement.setAttribute('data-mode', m);
    })();
  </script>
  <link rel="stylesheet" href="tema.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Website RT/RW</title>
  <meta name="description"
    content="Pengumuman, agenda, dan layanan warga RT. Panel pengurus untuk data warga, iuran, kas, dan surat pengantar.">
  <meta name="theme-color" content="#2c6e49">
  <link rel="icon" href="ikon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fontTema" rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body data-bagian="latar">
  <a class="lewati" href="#isi">Lewati ke konten</a>

  <header class="atas" data-bagian="nav">
    <a class="merek" href="#/" aria-label="Beranda">
      <span class="merek-logo" aria-hidden="true"><img class="merek-gambar" src="img/logo.svg" alt="" hidden
          onerror="this.remove()"><svg viewBox="0 0 64 64">
          <path d="M14 30 32 15l18 15v19H14z" fill="currentColor" />
          <rect x="27" y="36" width="10" height="13" rx="2" class="pintu" />
        </svg></span>
      <span class="merek-teks"><b data-tema-nama>RT</b><small id="merekSub">Layanan warga</small></span>
    </a>
    <nav class="atas-nav" id="navAtas" aria-label="Navigasi utama"></nav>
    <div class="atas-aksi">
      <button type="button" class="atas-cari" id="btnCariAtas" aria-label="Cari informasi warga">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <span>Cari informasi...</span>
      </button>
      <button class="ikon-btn" id="btnMode" type="button" aria-label="Ganti mode terang/gelap">
        <svg class="i-bulan" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z" />
        </svg>
        <svg class="i-matahari" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <a class="ikon-btn" id="btnAtur" href="#/panel/pengaturan" aria-label="Pengaturan" hidden><svg viewBox="0 0 24 24"
          aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1" />
        </svg></a>
      <button class="btn btn-garis btn-kecil" id="btnPanel" type="button"></button>
    </div>
  </header>

  <div class="kerangka">
    <nav class="samping" data-bagian="nav" id="navSamping" aria-label="Menu pengurus"></nav>
    <main id="isi" tabindex="-1" data-bagian="latar"></main>
  </div>
  <nav class="bawah" data-bagian="nav" id="navBawah" aria-label="Menu pengurus"></nav>

  <div class="toast-wadah" id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" data-bagian="panel" aria-labelledby="modalJudul">
    <div class="modal-isi" id="modalIsi"></div>
  </dialog>
  <dialog id="modalCari" class="modal-cari" aria-label="Pencarian informasi warga">
    <div class="modal-cari-isi" id="modalCariIsi"></div>
  </dialog>
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Pratinjau Foto Kegiatan"></div>
  <button type="button" id="btnKeAtas" class="btn-ke-atas" aria-label="Kembali ke atas" title="Kembali ke atas" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 15-6-6-6 6" />
    </svg>
  </button>
  <div id="cetak" aria-hidden="true"></div>

  <footer class="kaki-web" data-bagian="nav">
    <p class="kredit-maliki">Template oleh <a href="https://malikisaputra.biz.id" target="_blank" rel="noopener">@malikisaputra</a></p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>

</html>
